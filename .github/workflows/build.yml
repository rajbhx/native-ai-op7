name: Build

on:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast iteration (no R8). Use true during phases 1-3."
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Vulkan toolchain (headers + glslc for GGML_VULKAN)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev shaderc

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (arm64-v8a only)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-ai-op7-debug
          path: app/build/outputs/apk/debug/*.apk

      # Phase 3 adds validation gates: aapt badging (no testOnly, arm64-v8a
      # only), pm install smoke test via device runner.
