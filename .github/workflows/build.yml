name: Build

on:
  workflow_dispatch:
    inputs:
      # Reserved for the Phase-8 release path (R8/signing). Today every
      # dispatch builds the same debug APK; keep the input so callers and
      # AGENTS.md stay compatible until that path exists.
      fast:
        description: "Fast iteration (no R8). Use true during phases 1-3."
        type: boolean
        default: true
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Golden-standard security: the workflow only reads the repo, never writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Vulkan toolchain (host glslc + headers for GGML_VULKAN, Phase 7)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle MNN runtime lib (arm64-v8a, S6 - real backend, not a reference)
        run: |
          MNN_ZIP=mnn_3.6.1_android_armv7_armv8_cpu_opencl_vulkan.zip
          curl -fsSL -o "$MNN_ZIP" "https://github.com/alibaba/MNN/releases/download/3.6.1/$MNN_ZIP"
          unzip -o "$MNN_ZIP" "*arm64-v8a/libMNN.so" >/dev/null
          SO=app/src/main/jniLibs/arm64-v8a/libMNN.so
          mkdir -p "$(dirname "$SO")"
          cp mnn_3.6.1_android_armv7_armv8_cpu_opencl_vulkan/arm64-v8a/libMNN.so "$SO"
          file "$SO" | tee MNN_SO_INFO.txt
          grep -q "ARM aarch64" MNN_SO_INFO.txt \
            || { echo "::error::libMNN.so is not arm64-v8a"; exit 1; }
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Restore persistent debug keystore (same signature across builds)
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            mkdir -p ~/.android
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null \
              || { echo "::error::restored debug keystore failed keytool validation"; exit 1; }
            echo "restored persistent debug keystore"
          else
            echo "DEBUG_KEYSTORE_BASE64 not set - AGP generates a fresh keystore (installs will wipe app data)"
          fi

      - name: Build debug APK (arm64-v8a only)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Full JVM suite: agent/router/memory/integrity/skills JDBC tests plus
      # Robolectric Context-bound tests (ModelPreferences SharedPrefs). Keep
      # this in sync with app/build.gradle.kts testImplementation entries.
      - name: JVM unit tests (agent, router, memory, integrity, skills, Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Validate APK badging (testOnly + ABI gate)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BUILD_TOOLS_VERSION="$(find "$ANDROID_HOME/build-tools/" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | head -n 8
          echo "$BADGING" | grep -q "package: name='com.engine.nativeai'" \
            || { echo "::error::unexpected package id"; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'29'" \
            || { echo "::error::minSdk mismatch, expected 29"; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'34'" \
            || { echo "::error::targetSdk mismatch, expected 34"; exit 1; }
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'" \
            || { echo "::error::ABI mismatch, expected arm64-v8a"; exit 1; }
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/"; then
            echo "::error::no native libs for arm64-v8a"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q "lib/arm64-v8a/libMNN.so"; then
            echo "::error::MNN runtime lib missing from APK"
            exit 1
          fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'testOnly'; then
            echo "::error::APK is android:testOnly=true; Android blocks UI installs"
            exit 1
          fi
          sha256sum "$APK" | tee SHA256SUMS.txt
          echo "VALIDATION PASSED for $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-ai-op7-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256SUMS.txt
          retention-days: 14
