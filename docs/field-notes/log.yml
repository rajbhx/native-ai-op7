# native-ai-op7 field-notes journal — machine-readable source of truth.
# The playbook sync (rajbhx/op7-special-build-playbook) consumes this.
sections:
  - id: A
    title: CI & build pipeline
    entries:
      - id: A1
        problem: "llama.cpp submodule tag checkout fails in a shallow clone ('origin/b10428 is not a commit')"
        cause: "--depth 1 --branch <tag> fetches only the default branch, so release tags are absent"
        solution: "submodule add shallow, then fetch --depth 1 origin tag b10428 + checkout + git add the gitlink"
        tags: [submodule, llama.cpp, git]
      - id: A2
        problem: "'E: Unable to locate package shaderc' on the Ubuntu 24.04 runner"
        cause: "shaderc was restructured in noble; llama.cpp's own CI uses glslc + spirv-headers"
        solution: "apt-get install -y glslc libvulkan-dev spirv-headers"
        tags: [vulkan, github-actions, llama.cpp]
      - id: A3
        problem: "'GGML_CPU_ALL_VARIANTS requires GGML_BACKEND_DL' at CMake configure"
        cause: "llama.cpp gates ALL_VARIANTS behind dynamic backend loading (ggml/src/CMakeLists.txt:373)"
        solution: "set GGML_BACKEND_DL=ON together with GGML_CPU_ALL_VARIANTS=ON (mirrors llama.cpp build-android.yml)"
        tags: [cmake, llama.cpp, github-actions]
      - id: A4
        problem: "'Inconsistent JVM-target compatibility (1.8 vs 17)' fails compileDebugKotlin"
        cause: "AGP defaults Java target 1.8 while Kotlin jvmTarget defaulted to 17"
        solution: "compileOptions VERSION_17 + kotlinOptions { jvmTarget = \"17\" } inside android {}"
        tags: [gradle, kotlin, jvm]
      - id: A5
        problem: "'Unresolved reference ... BaseAppModuleExtension.kotlinOptions' in build.gradle.kts"
        cause: "kotlinOptions used at top level instead of scoped inside the android {} extension"
        solution: "move the block inside android {}"
        tags: [gradle, kotlin]
      - id: A6
        problem: "'no matching function for call to llama_memory_clear' at b10428"
        cause: "KV-cache API refactor — memory ops take a llama_memory_t handle, not the context"
        solution: "llama_memory_clear(llama_get_memory(g_ctx), false) with null guard"
        tags: [llama.cpp, api, kv-cache]
      - id: A7
        problem: "lifecycleScope unresolved in MainActivity (receiver mismatch)"
        cause: "lifecycleScope is a LifecycleOwner extension; plain Activity is not a LifecycleOwner"
        solution: "own CoroutineScope(SupervisorJob() + Dispatchers.Main), cancel in onDestroy, drop lifecycle-runtime-ktx"
        tags: [kotlin, android, lifecycle]
      - id: A8
        problem: "llama_load_model_from_file / llama_free_model deprecated at b10428"
        cause: "llama.cpp renamed the model API (llama_model_load_from_file / llama_model_free)"
        solution: "use the current names, verified against the pinned header"
        tags: [llama.cpp, api]
      - id: A9
        problem: "sampler chain params at b10428 carry only no_perf — penalties missing"
        cause: "llama_sampler_chain_params has just no_perf; penalties are a separate sampler object"
        solution: "add llama_sampler_init_penalties(n_vocab, last_n, repeat, 0, 0) to the chain before top_k/top_p/temp/dist"
        tags: [llama.cpp, sampling]
      - id: A10
        problem: "SafeExpr compile error: 'inferred type is () -> Int but SafeExpr.Ref was expected'"
        cause: "parseExpr called with a trailing lambda { pos } instead of the Ref holder"
        solution: "val pos = Ref(0); parseExpr(tokens, pos); check pos.value != tokens.size"
        tags: [kotlin, parser, tests]
      - id: A11
        problem: "Redeclaration: ToolResult + 'Cannot find a parameter with this name: id/inputHash'"
        cause: "agent tool result duplicated the Phase 2 DB record name ToolResult (MemoryModels.kt)"
        solution: "rename tool-execution result to ToolOutput; the DB record keeps ToolResult"
        tags: [kotlin, naming, agent]
      - id: A12
        problem: "'Returns are not allowed for functions with expression body' in parseSseEvent"
        cause: "unlabeled return null inside fun ... = try { }"
        solution: "make the if/else the try value; no bare return"
        tags: [kotlin, sse, openai]
      - id: A13
        problem: "'Smart cast to ModelDescriptor is impossible — captured by a changing closure'"
        cause: "nullable var reassigned inside a catch while read inside flow lambdas"
        solution: "non-null via ?: run { emit(Error); return@flow }; var stays non-null"
        tags: [kotlin, smart-cast, agent]
      - id: A14
        problem: "ld.lld: undefined symbol ggml_threadpool_new / ggml_threadpool_free"
        cause: "threadpool API lives in the CPU backend (ggml-cpu.c), dlopen'd under GGML_BACKEND_DL=ON — not linkable from native-lib"
        solution: "pin the calling decode thread before first graph compute; pthreads inherit creator affinity; no direct ggml-cpu link; -llog for logcat"
        tags: [llama.cpp, affinity, linker]
      - id: A15
        problem: "setContent in MainActivity: 'receiver type mismatch'"
        cause: "androidx.activity.compose.setContent is a ComponentActivity extension; activity extended plain android.app.Activity"
        solution: "extend androidx.activity.ComponentActivity"
        tags: [compose, kotlin, activity]
      - id: A16
        problem: "memory retrieval ranked by hand-rolled linear recency, not the spec's BM25 × exponential decay"
        cause: "Phase 2 scoring predated the math spec (score = utility*0.5 + recency*0.3 + success*0.2)"
        solution: "ftsCandidates selects bm25(experiences_fts) AS bm25_rank; score = -rank * exp(-0.05*ageDays) + small tiebreaks; decay SQL lambda 0.02 -> 0.05"
        tags: [sqlite, fts5, ranking, math]
      - id: A17
        problem: "FGS specialUse requires both the permission and the subtype property at targetSdk 34"
        cause: "Android 14 introduced FOREGROUND_SERVICE_SPECIAL_USE with a required PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
        solution: "declare FOREGROUND_SERVICE + FOREGROUND_SERVICE_SPECIAL_USE + POST_NOTIFICATIONS; service foregroundServiceType=specialUse + property; request POST_NOTIFICATIONS at runtime (API 33+)"
        tags: [android, foreground-service, manifest]
      - id: A18
        problem: "setup-java v4 deprecation annotation; web_search ok flag coupled to a magic string"
        cause: "actions/setup-java@v4 is deprecated; WebSearchTool checked result.startsWith('web search unavailable')"
        solution: "migrate to actions/setup-java@v5; SearchProvider returns SearchResult(text, ok), LocalFallbackProvider ok=false; playbook phase 5 marked done"
        tags: [github-actions, agent, playbook, kotlin]
      - id: A19
        problem: "local llama.cpp init fails on-device: 'no backends are loaded'"
        cause: "AGP default extractNativeLibs=false packs .so in APK so nativeLibraryDir is empty; ggml_backend_load_all() searched exec dir + cwd only"
        solution: "android:extractNativeLibs=true + ggml_backend_load_all_from_path(nativeLibraryDir) before llama_backend_init; verified on-device init OK (RSS 729 MB, Qwen0.5B Q4_K_M, contended)"
        tags: [llama.cpp, ggml, android, jni, apk]
      - id: A20
        problem: "Agent button crash: SQLiteException no such module: fts5"
        cause: "OP7 OxygenOS Android 10 SQLite lacks the FTS5 extension; MemoryDatabase.onCreate DDL failed and startSession ran outside try/catch -> uncaught coroutine crash"
        solution: "detect FTS5 availability (try/catch DDL), fall back to bounded LIKE term-hit retrieval; wrap startSession/endSession so memory failure degrades gracefully"
        tags: [sqlite, fts5, memory, crash, oneplus]
      - id: A21
        problem: "Agent unusable: persisted remote provider not re-registered after restart; local model required manual pre-load"
        cause: "providers registered only on picker selection; runAgent early-returned for unloaded local; messages not actionable"
        solution: "re-register persisted remote at startup; auto-load local GGUF on Agent/Generate; add in-app GGUF downloader (space check, magic verify, tmp+rename) + context selector; industrial UI redesign with real engine-state header"
        tags: [agent, router, models, download, ui, compose]
      - id: A22
        problem: "UI implied free remote models require an API key"
        cause: "health() hard-failed on blank key; Zen anonymous billing source is actually supported (per-IP rate-limited)"
        solution: "health() treats anonymous as healthy; omit Authorization when key blank; 429 -> actionable message; UI shows amber 'Free · anonymous (rate-limited)' and dialog clarifies keys only raise the quota"
        tags: [zen, api-key, free-tier, anonymous, rate-limit]
      - id: A23
        problem: "evaluate LiteRT/LiteRT-LM as a faster local inference backend for OP7"
        cause: "LiteRT-LM (Google AI Edge, ex-TFLite) advertises GPU/NPU LLM acceleration, tool use, on-device LoRA; local 1B Q4 is ~1.8 tok/s (contended)"
        solution: "audited upstream (v0.16.0); parked as reference only (ADR-007 + docs/source-research/litert-lm.md) because runtime is .tflite/.litertlm with no GGUF path — replacing llama.cpp needs a new export pipeline + second runtime and risks the 1.5 GB gate. Revisit on triggers: memory embedder via TFLite, same-device benchmark win, Phase 9 LoRA"
        tags: [litert, tflite, inference, adr, reference]
      - id: A24
        problem: "remote quick-send/Agent showed ERROR 'generate failed: Flow exception transparency is violated' and produced zero tokens"
        cause: "OpenAICompatibleProvider emitted ModelStreamEvent.Error from a bare catch block AND emitted inside withContext(Dispatchers.IO) within the flow builder; kotlinx.coroutines 1.8 bans emit in a context different from the collection context (FlowExceptionTransparencyViolatedException), killing the whole stream"
        solution: "stream() = flow { HTTP/SSE work }.flowOn(Dispatchers.IO) + .catch { emit(Error) } - never emit inside withContext/catch inside a builder; regression tests (unreachable endpoint -> Error event; local ServerSocket SSE stub -> tokens then Done); reproduced locally with kotlinc + kotlinx-coroutines-core-jvm + org.json jars before burning CI cycles"
        tags: [kotlinx-coroutines, flow, sse, provider, crash, kotlin]
      - id: A25
        problem: "pm install -r -d -t failed INSTALL_FAILED_UPDATE_INCOMPATIBLE on every CI APK; certs drifted run-to-run (0b045c7c/64ced54c/7f721a2c) vs persistent 21add73b"
        cause: "AGP silently regenerated a random debug keystore each run despite the restored ~/.android/debug.keystore (JDK17 default keystore type is PKCS12 so a JKS fails to load; explicit signingConfig also failed to load it) - only the installed app's original key allows in-place update"
        solution: "pragmatic, per user decision: accept the new signature - pm uninstall + pm install -t + restore model from /sdcard/Download/nativeai-model-backup.gguf via 'run-as com.engine.nativeai sh -c cat > files/models/model.gguf' (app uid CAN read /sdcard/Download); keep DEBUG_KEYSTORE_BASE64 restore + keytool validation in the workflow but do not gate builds on it"
        tags: [signing, keystore, install, apk, ci, data-wipe]
      - id: A26
        problem: "cannot push files (APK) to the device from the proot shell: proot /storage/emulated/0/1DMP is an ext4 image not visible to the device shell; proot /tmp differs; adb unusable (127.0.0.1:5555 timeout); SELinux blocks pm from reading /sdcard"
        cause: "proot rootfs is a separate filesystem; device shell sees the real /storage/emulated/0/1DMP (1DM download folder); host-bridge shizuku has no root"
        solution: "python3 -m http.server 8000 --bind 0.0.0.0 inside a persistent exec session + device 'curl -o /data/local/tmp/x.apk http://192.168.1.3:8000/x.apk' + 'pm install -t /data/local/tmp/x.apk'; model restore via run-as cat from /sdcard/Download (verified READ_OK)"
        tags: [install, transfer, proot, shizuku, apk, oneplus]
      - id: A27
        problem: "Track A compile: 'Unresolved reference: EngineServiceState' + 'Comparison of incompatible enums'"
        cause: "enum declared INSIDE the companion object is not promoted to the outer class name (only members are); Class.EngineServiceState fails to resolve"
        solution: "declare EngineServiceState at top level of the service file; reference EngineServiceState.STOPPED directly"
        tags: [kotlin, enum, companion, compile]
      - id: A28
        problem: "Track E compile: 'Unresolved reference: context' in ExecutionManager.backend()"
        cause: "a constructor parameter without val/var is only visible in property initializers/init, not in method bodies"
        solution: "class ExecutionManager(private val context: Context)"
        tags: [kotlin, constructor, compile]
      - id: A29
        problem: "JVM tests: ExecutionLayerTestKt > initializationError InvalidTestClassError"
        cause: "appended JUnit test landed OUTSIDE the class (after the closing brace) -> top-level @Test in the file facade ExecutionLayerTestKt, which JUnit rejects"
        solution: "keep every @Test inside the class body; verify with tail -n before pushing (104 tests now green)"
        tags: [junit, kotlin, test, compile]
      - id: A30
        problem: "Termux execution absent at the core execution layer; user wants it core-level, optional Anyclaw/Codex/OpenCode later"
        cause: "audit had parked TermuxBackend; only LocalProcessBackend existed"
        solution: "TermuxBackend (clean-room): com.termux detection + RunCommandService intent (com.termux.RUN_COMMAND) + file exchange /sdcard/Download/nativeai/<runId>/; TermuxStatus machine with honest reasons; ExecutionManager (Termux READY ? termux : local); Tools settings row; terminalEnabled/terminalAllowlist prefs; READ_EXTERNAL_STORAGE maxSdk 32 + MediaStore fallback for API 33+. One-time user setup: termux-setup-storage + Allow external apps"
        tags: [termux, execution, intent, tool, backend, memory]
      - id: A31
        problem: "tools invisible/uncontrolled; no inventory contract between ToolRegistry and UI"
        cause: "ToolRegistry exposed only descriptions(); settings had just the terminal row"
        solution: "ToolDescriptor + ToolRegistry.snapshot() + shared Toolbox (one construction path for agent and settings); Tools section shows every tool with AVAILABLE/DISABLED/APPROVAL/PRIVILEGED badges"
        tags: [tools, registry, ui, inventory]
      - id: A32
        problem: "agent trace could not prove which execution backend ran a terminal command"
        cause: "TerminalTool output had no backend marker"
        solution: "AgentTool.backendLabel (termux/local) + TerminalTool prefixes observations with [termux]/[local]"
        tags: [trace, termux, observability]
      - id: A33
        problem: "no authoritative model status line; quota static until manual health press; no system prompt override; Stats lacked affinity + dynamic budget"
        cause: "no derived status, no auto health refresh, hardcoded system prompt, affinity pin result only logged"
        solution: "ModelStatus.line() (READY/AVAILABLE/NO MODEL FILE/ONLINE/OFFLINE) + auto health 60s cache + persisted systemPromptOverride (ThinkingAgent + quick-send) + affinity_applied in native stats JSON + Stats budget/max-ctx lines"
        tags: [model, state, health, system-prompt, affinity, stats]
      - id: A34
        problem: "schema v3 onUpgrade was a dev reset - every update dropped the whole memory DB (experiences/facts/messages)"
        cause: "onUpgrade called DROP TABLE + onCreate as a dev shortcut"
        solution: "SCHEMA_VERSION 4 + real migration: v3->v4 keeps all existing tables and only adds source KB tables (source_collections, sources, source_files, source_chunks + external FTS5 source_chunks_fts with triggers); SourceSchema holds pure DDL strings shared with the JVM sqlite-jdbc twin; migration-retention test proves old rows survive"
        tags: [sqlite, migration, schema, sources]
      - id: A35
        problem: "source registry/updater logic untestable on JVM because MemoryDatabase extends Android SQLiteOpenHelper"
        cause: "no storage contract; only the Android implementation existed"
        solution: "SourceStore interface implemented by MemoryDatabase (device) and JdbcSourceStore (test-only org.xerial:sqlite-jdbc, bundles FTS5) running the exact SourceSchema DDL; FakeSourceStore for unit tests; tests for migration retention, chunker bounds, candidate staleness order, 304 conditional fetch, changed-blob-only, read-time eviction, BM25 + LIKE search"
        tags: [testing, sqlite-jdbc, jvm, sources]
      - id: A36
        problem: "RAW_TEXT sources errored on the periodic refresh (marked ERROR)"
        cause: "updateSourceInternal dispatched RAW_TEXT to the HTTP path, which requires a contentUrl"
        solution: "RAW_TEXT skipped in the updater - it is indexed once on add via db.replaceSourceChunks"
        tags: [sources, updater, bug]
      - id: A37
        problem: "chunk overlap disappeared after the word-boundary refactor"
        cause: "loop advanced start = end (no overlap), losing boundary context between chunks"
        solution: "advance start = end - overlapChars with a progress guard; SourceChunkerTest asserts consecutive chunks share words"
        tags: [chunker, retrieval]
      - id: A38
        problem: "future memory/Source-KB phases lacked a reference for scoped verbatim memory + pluggable retrieval"
        cause: "user pointed at MemPalace/mempalace (MIT) as a source of ideas for later phases"
        solution: "recorded docs/source-research/mempalace-reference.md: scoped hierarchy (wings/rooms/drawers) maps to collections/sources/files-chunks; pluggable backend seam matches SourceStore/MemoryProvider; hybrid keyword fallback validates FTS5+LIKE; embedder sizes (~80 MB minilm) give ADR-007 a real budget figure; LongMemEval R@5 as a future benchmark; keep read_time eviction for verbatim-growth control"
        tags: [memory, sources, reference, research]
      - id: A39
        problem: "local model support was hardcoded to one fixed path (models/model.gguf) in nine EngineScreen call sites; multiple GGUFs were impossible and LocalModelProvider always exposed descriptor id local-llama"
        cause: "MainActivity registered one LocalModelProvider; UI built modelFile from a fixed path; provider descriptor was a constant, so per-file providers would collide"
        solution: "LocalModelLibrary (pure JVM) scans models/*.gguf with stable ids (model.gguf -> local-llama, others -> local-<stem>); descriptor-override param on LocalModelProvider so each file gets its own provider sharing one NativeEngine; syncInto drops deleted files and keeps a local-llama placeholder when empty; LocalModelImporter (SAF) with progress + StatFs +64 MB margin + GGUF magic guard + temp rename; RemoteProviderBootstrap skips all local-* ids; picker '＋ Pick GGUF from storage…' row + size/quant subtitles; model card Delete; loadedPath guard reloads on model switch"
        tags: [models, local, gguf, saf, multi-model]
      - id: A40
        problem: "no observability: AgentEvent lacked timestamps/durations, tool timings and tok/s were untracked, Stats only dumped memoryStats() to the status line"
        cause: "no metrics contract; trace events were plain data; no jank/leak tooling"
        solution: "RuntimeMetrics (load, first-token, tok/s, per-tool, errors/retries, restarts, jank) + DiagnosticsProvider/RuntimeDiagnostics + DiagnosticsDialog; AgentEvent atMs/durationMs with timestamped trace lines (TraceLine strips the prefix); FrameJankMonitor (Choreographer, no dep); LeakCanary debugImplementation only; .maestro/acceptance flows on the physical device (arm64-only APK cannot run on x86_64 CI emulators); docs/source-research/perf-observability-reference.md + license review rows"
        tags: [observability, metrics, diagnostics, jank, leakcanary, maestro]
      - id: A41
        problem: "Engine Settings bottom sheet did not scroll on the phone (1080x2400): HARDWARE TUNING, Start service, Download GGUF, Stats and TOOL INVENTORY sat below the fold and were unreachable, so the buttons looked 'missing' and Download/Stats could not be exercised"
        cause: "ModalBottomSheet body Column had no scroll modifier; the sheet is full-height (skipPartiallyExpanded), so taller-than-screen content was clipped"
        solution: "added .verticalScroll(rememberScrollState()) to the sheet Column"
        tags: [ux, bottom-sheet, scroll, settings, buttons]
      - id: A42
        problem: "app SIGSEGV'd (native, fault addr 0x0) in ggml_compute_forward_rope (libggml-cpu-android_armv8.2_2.so) ~2 s after 'agent stopped' while running Qwen2.5-0.5B locally, killing the whole process (engine service runs in the same process)"
        cause: "stopRun() called runJob.cancel() but immediately released running/runJob; local generation is a blocking llama.cpp decode inside callbackFlow, so coroutine cancellation only closes the flow (which fires nativeCancel) and the native loop unwinds on the next sampled token (~0.5-1 s); starting a new run in that window overlapped two generations on one llama_context, corrupting the graph"
        solution: "stopRun() now calls engine.cancel() first (stops the native loop promptly) and keeps running=true until the job's finally unwinds, so a new run can never overlap a still-decoding engine; both quick-send and agent paths reset running in finally"
        tags: [crash, sigsegv, rope, stop, concurrency, native, llama]
      - id: A43
        problem: "startup status line was a stale constant ('Engine library loaded. Put a GGUF in: …') shown even when models/model.gguf existed"
        cause: "status was initialized once with a fixed string, never reflecting the actual library scan"
        solution: "initialize from LocalModelLibrary.scan(): empty -> guidance to Download/import; non-empty -> 'Local library ready: <files>'"
        tags: [ux, status, local-library, contradiction]
      - id: A44
        problem: "pm install -r of the CI build failed INSTALL_FAILED_UPDATE_INCOMPATIBLE (signatures do not match) even though the workflow restores DEBUG_KEYSTORE_BASE64"
        cause: "the installed app predates the current persistent keystore value; the secret was rotated/replaced at some point, so the old and new debug keys differ"
        solution: "one-time pm uninstall + reinstall (app data loss), re-stage the GGUF via run-as; future builds signed with the same secret update in place — verify with the next install before trusting 'persistent'"
        tags: [ci, keystore, install, signature, update-incompatible]
      - id: A45
        problem: "pushing code fix + docs back-to-back cancelled the code CI build"
        cause: "build.yml concurrency group build-<ref> with cancel-in-progress: true cancels the previous run on every push"
        solution: "push code first, wait for its run to finish (or at least pass the build job) before pushing docs; only the latest HEAD build matters"
        tags: [ci, github-actions, concurrency, cancel]

      - id: A46
        problem: "CI unit-test compile failed: document tests appended outside SourceUpdaterTest class + marker mismatch (doc-1-12 vs 13-byte PDF)"
        cause: "hand-edited test file placed new tests after the class closing brace; unchanged-doc marker did not match the real byte size"
        solution: "move appended tests back inside the class; use the real marker (doc-1-13); rely on CI test compilation even when a local build is impossible"
        tags: [testing, kotlin, ci, structure]
      - id: A47
        problem: "SourceSeedLoader.parse('') threw JSONException in blankInputIsEmpty"
        cause: "only load() guarded exceptions; org.json JSONObject(String) throws on blank input"
        solution: "parse() now catches and returns an empty list - malformed catalogs are honest state, never a crash"
        tags: [org.json, parsing, robustness]
      - id: A48
        problem: "one CI build per main push made validation serial; every push cancels the previous run"
        cause: "concurrency group build-<ref> with cancel-in-progress; on.push only builds main"
        solution: "feature work on ci/* branches + gh workflow run build.yml --ref ci/<branch> = parallel builds (per-ref concurrency); merge the validated branch into main"
        tags: [ci, parallel, branches, workflow-dispatch]
      - id: A49
        problem: "local inference had no runtime abstraction (GGUF/llama-only paths)"
        cause: "single phase-1 engine; MNN stayed a parked reference"
        solution: "RuntimeKind on ModelDescriptor, InferenceBackend seam, MnnBackend dlopen probe over CI-bundled libMNN.so 3.6.1; MNN model inference gated on an on-device benchmark"
        tags: [mnn, runtime, jni, abstraction]
      - id: A50
        problem: "vector index had no owner; embeddings need a validated model"
        cause: "roadmap listed vectors but no runtime or gate existed"
        solution: "vendored USearch v2.11.3 headers + vector-lib + USearchVectorIndex (bounded/persisted) + EmbeddingProvider seam; hybrid BM25+HNSW RRF dormant until the benchmark gate passes"
        tags: [usearch, vector, hybrid, gating]

      - id: A51
        problem: "Stats/Diagnostics crashed the app: UnsatisfiedLinkError, JNI export did not match the Kotlin companion object"
        cause: "nativeSelfTest() lives in USearchVectorIndex.Companion, so the export needs Java_com_engine_nativeai_USearchVectorIndex_00024Companion_nativeSelfTest; plain name left an uncaught NoSuchMethodError in the composable"
        solution: "renamed the export, fail-closed selfTest() via runCatching, and wrapped MNN+VECT diagnostics probes in runCatching with a CoreErrors record - Diagnostics can never crash again"
        tags: [jni, crash, diagnostics, usearch, companion-object]
      - id: A52
        problem: "Sources seed rows errored with 'coroutine scope left the composition' after navigation"
        cause: "composition-scoped LaunchedEffect updateOnce() gets CancellationException on leave, caught as a normal failure"
        solution: "SourceUpdater rethrows CancellationException (cancel != source error, next cycle retries clean); real failures recorded to CoreErrors"
        tags: [coroutines, cancellation, sources, state]
      - id: A53
        problem: "handled failures only set a scrolling status string; uncaught crashes killed the process with no in-app trace"
        cause: "no central failure surface"
        solution: "core ErrorLog (bounded cap 100, thread-safe) + process crash hook in NativeAiApp + CoreErrors; agent/generate/local-init/diagnostics/source record entries; ERRORS tab with count, CLEAR/REFRESH, expandable detail; ErrorLogTest covers order/cap/clear/truncation/null"
        tags: [error-log, observability, crash-hook, ui, errors-tab]
      - id: A54
        problem: "split-brain RAM ceiling: native rss_over_limit fired at 1500 MiB while the Kotlin watchdog/UI used 1536 MiB (1.5 GB)"
        cause: "MemoryMonitor.cpp hardcoded 1572864000ULL (=1500 MiB) independently of Op7SystemProfile.MEMORY_LIMIT_BYTES (=1610612736 / 1536 MiB)"
        solution: "single constexpr kOp7MemoryLimitBytes = 1610612736ULL in MemoryMonitor.hpp used by statsJson; contract pinned by MemoryBudgetTest.nativeCeilingMatchesKotlinSingleSourceOfTruth (SYSTEM-PARAMETERS.json max_total_runtime = 1536 is authoritative)"
        tags: [memory, ceiling, cpp, kotlin, contract-test]
      - id: A55
        problem: "KV-cache estimate used 28 layers / 2048 hidden for every model, overestimating the shipped Qwen2.5-1B (24/1024) by ~2.3x and understating maxSafeNctx"
        cause: "MemoryPlanner/MemoryBudget defaulted to 3B-class geometry and pre-flight runs before the model loads, so real geometry was never available"
        solution: "GgufMetadataReader (strict GGUF v2/v3 header parse: architecture/block_count/embedding_length, null on any anomaly) + GgufMetaCache keyed by path/size/mtime; planner/budget take nullable layers/hiddenDim with labeled DEFAULT_LAYERS/DEFAULT_HIDDEN_DIM fallback; EngineScreen pre-flight passes measured values"
        tags: [memory, gguf, metadata, planner, qwen1b, kv-cache]
      - id: A56
        problem: "accent red used for non-primary/non-error elements (status text, quick-download links, progress bar, picker selection/check/link)"
        cause: "flat color tokens with no semantic roles; red was copy-pasted as the default accent"
        solution: "semantic role tokens (OpPrimaryAction/OpStatusSuccess/OpStatusWarn/OpStatusInfo/OpStatusDanger/OpLinkAccent) in Theme.kt; remapped EngineScreen + ModelPicker so red = one primary action + danger only; picker filter chips now neutral outline/fill like ValuePill"
        tags: [ux, color, tokens, red, hierarchy]
      - id: A57
        problem: "'Agent' button crash: run state lived in the composition; an uncaught exception killed the process"
        cause: "run coroutine owned by EngineScreen; exceptions escaped to the process crash hook, not the ERROR surface"
        solution: "EngineViewModel = single authority (one-way data flow); agent/generate/local-init exceptions caught, recorded to CoreErrors, surfaced in ERRORS tab + status"
        tags: [viewmodel, crash, agent, error-log, state]
      - id: A58
        problem: "rotation/process death silently cancelled a run and wiped prompt/output/trace (~20 remember mutableStateOf slots)"
        cause: "no state survival; rememberSaveable covered only two booleans"
        solution: "EngineViewModel + StateFlow (prompt/output/answer/running/engineState/status/loaded/elapsed/lastRoute/pendingApproval); run lives in ViewModel scope, survives recreation"
        tags: [viewmodel, stateflow, configuration-change, state]
      - id: A59
        problem: "no in-loop tool approval UX; REQUIRES_APPROVAL/PRIVILEGED tools were auto-denied with no consent path"
        cause: "ToolExecutor decided alone and the UI never saw the request"
        solution: "ToolApprovalRequest/ApprovalDecision + injected onApproval (default DENY); EngineViewModel suspends the run on pendingApproval, persists ALWAYS_ALLOW in toolAlwaysAllow; Allow once / Always / Deny dialog; PRIVILEGED stays policy-blocked"
        tags: [tools, approval, permissions, consent]
      - id: A60
        problem: "no transient feedback: successes/failures only in a scrolling status line; destructive actions had no confirm"
        cause: "no snackbar layer, no confirm dialogs"
        solution: "UiEvent SharedFlow + SnackbarHost (Retry/Undo); confirm dialog for model deletion; PillButton loading spinner; Agent button becomes Stop while running"
        tags: [snackbar, feedback, confirm, loading]
      - id: A61
        problem: "bottom sheet and prompt field sat under nav bar/keyboard on Android 10 gesture nav"
        cause: "no imePadding, no adjustResize"
        solution: "windowSoftInputMode=adjustResize on MainActivity + imePadding on screen root"
        tags: [ime, insets, android-10, ux]
      - id: A62
        problem: "sub-48dp touch targets; header status was color-only"
        cause: "text-based pills/chips with 5dp vertical padding; no semantics"
        solution: "48dp min heights on PillButton/ValuePill/FilterChip; stateDescription + elapsed on header, liveRegion on status, contentDescription on send/clear/model chip"
        tags: [accessibility, a11y, touch-target, semantics]
      - id: A63
        problem: "memory screen had no per-component budget visualization"
        cause: "budget math existed (MemoryBudget) but only as a text line in settings"
        solution: "ModelMemoryBudget card on Memory screen: weights (measured from largest local GGUF), KV (est @2048 ctx), graph/sqlite (fixed) bars vs 1536 MB cap, labeled measured vs estimate"
        tags: [memory, budget, ui, bars]
      - id: A64
        problem: "agent/generate loops and model init ran on the Main thread (llama decode, HTTP readLine, JNI init) — UI jank during every run; RuntimeMetrics was also written from multiple contexts"
        cause: "ViewModel scope used Dispatchers.Main.immediate and inherited it into run/collect/init; metrics object had plain fields"
        solution: "runAgent/sendQuick launch on Dispatchers.Default (UI updates only via thread-safe StateFlows), ensureLocalLoaded wraps native init in withContext(Default), RuntimeMetrics methods @Synchronized (read from Main diagnostics, written off Main)"
        tags: [threading, main-thread, stateflow, metrics]
      - id: A65
        problem: "model-load state was contradictory: header showed COMPLETED right after load (loading is not a task result), and a failed re-init left the stale loaded flag true"
        cause: "ensureLocalLoaded set EngineUiState.COMPLETED on success and never cleared _loaded on failure"
        solution: "success -> EngineUiState.READY; failure -> _loaded=false + loadedPath=null; native init off Main"
        tags: [state, model-load, memory]
      - id: A66
        problem: "run-state races and semantics: double-send could start two runs (flag set inside the coroutine), runAgent had no running guard, stop() double-appended [STOPPED] (stop + the coroutine catch both wrote it), Clear did not reset engine state, primary Agent button was disabled while running so its Stop branch was dead code"
        cause: "flags/status handled in two places (UI + VM) with no single owner"
        solution: "sendQuick sets _running synchronously before launch; runAgent guards if (_running.value) return; stop() only cancels (coroutine catch owns [STOPPED]/status); clearRun resets engineState/status/lastRoute/elapsed; primary button toggles Agent<->Stop and stays enabled; Clear disabled while running"
        tags: [state-machine, race, stop, clear, buttons]
      - id: A67
        problem: "no curated, license-checked source catalog mapped to the architecture layers"
        cause: "references accumulated in chat history without ownership/license/fit analysis"
        solution: "docs/GOLDEN-SOURCE-CATALOG.md — per-layer table (inference/memory/sources/terminal/observability/UI/test), each entry: what to take, license, OP7/1.5GB fit, status (IN/PARKED/CANDIDATE/REF); negative picks documented; adoption order for next phases"
        tags: [catalog, sources, licensing, reference]
      - id: A68
        problem: "router health state was reset every run — each runAgent/sendQuick built a fresh ModelRouter with a new ProviderHealthMonitor, so repeated failures never accumulated and measured latency was ignored"
        cause: "health monitor defaulted inside ModelRouter instead of being shared"
        solution: "EngineViewModel owns one ProviderHealthMonitor; routers are constructed with it; reportLatency + reportSuccess/reportFailure recorded per run; router sort adds measured latency as tiebreak (nulls last, never fabricated)"
        tags: [router, health, latency, state]
      - id: A69
        problem: "agent runs were single-shot: prior conversation was stored but never injected as context, and answers never cited which source KB hits were used"
        cause: "ContextManager had no conversation section; AgentEvent.Final carried no sources"
        solution: "ContextManager.build(conversation=...) with priority system > user > observations > conversation > memory > sources; ThinkingAgent.run(priorConversation=...) fed from the last session's tail; AgentEvent.Final.sources populated from source hits and rendered as SOURCE lines under the answer"
        tags: [multi-turn, context, citations, sources]
      - id: A70
        problem: "model manager had no integrity: downloads only checked the GGUF magic, so a corrupted file could load and silently produce garbage; no storage accounting"
        cause: "no checksum pipeline, no manifest"
        solution: "ModelIntegrity (streaming SHA-256, IO) + ModelManifest (models/.manifest.json: sha256/bytes/url/ts) + downloader computes SHA-256 while streaming; ensureLocalLoaded refuses checksum mismatch; LocalModelLibrary.storageUsedBytes() drives a STORAGE line; manifest recorded on download and import"
        tags: [integrity, sha256, manifest, model-manager]
      - id: A71
        problem: "skills were seeded but never wired: DefaultSkills/SkillManager existed with no consumer"
        cause: "skill registry was created nowhere in the runtime graph"
        solution: "Toolbox.skillManager (init from app files dir, seeds on first run); ThinkingAgent takes skills and appends the task-matched skill's workflow/constraints to the system prompt (deterministic skillFor(taskType), no model round-trip)"
        tags: [skills, agent, system-prompt]
      - id: A72
        problem: "hybrid search plumbing (USearch + embeddings) was defined but never connected to SourceSearch, and there was no honest gate explaining why vectors stay off"
        cause: "Toolbox built SourceSearch without vectorIndex/embeddingProvider"
        solution: "Toolbox wires USearchVectorIndex(384) + MnnEmbeddingProvider (lib probe + model asset + EMBEDDING_GATE_PASSED); RRF merge activates only when both report available; docs/EMBEDDINGS.md documents model choice, conversion, placement, gate steps — no fake vector capability"
        tags: [embeddings, hybrid, usearch, mnn, gating]
      - id: A73
        problem: "benchmark battery existed (ModelBenchmark) but had no UI; approval policy had no per-tool persistence UI"
        cause: "benchmark and policy controls were not wired into Diagnostics/TOOL INVENTORY"
        solution: "Diagnostics dialog gains Benchmark (per selected model, measured results); REQUIRES_APPROVAL tools get an ALWAYS toggle persisting toolAlwaysAllow"
        tags: [benchmark, diagnostics, approval, ui]
      - id: A74
        problem: "memory only grew; low-utility entries were never pruned"
        cause: "deleteLowUtilityMemories existed but nothing called it"
        solution: "EngineViewModel prunes low-utility memories (threshold 0.05) after each completed agent run, best-effort, never failing the run"
        tags: [memory, lifecycle, pruning]
      - id: A75
        problem: "cancelled/interrupted GGUF downloads discarded the partial file, so large models had to restart from zero"
        cause: "ModelDownloader deleted .tmp on every failure path including cancel and network timeouts"
        solution: "keep .tmp on cancel/IOException; next download() sends Range: bytes=N- and appends; SHA-256 replayed over existing bytes so the manifest checksum stays full-file; servers returning 200 (ignored Range) or 416 restart cleanly; UI shows 'paused — N MB cached; tap Download to resume' and a resume hint when a partial exists"
        tags: [download, resume, range, integrity, ui]
      - id: A76
        problem: "the router could substitute a different model than the user's explicit selection without saying why"
        cause: "routing decisions were silent; health errors were recorded but never surfaced in trace/status"
        solution: "AgentEvent.Routed gains reason; ModelRouter.lastError(providerId); ThinkingAgent emits 'preferred X unavailable (why) — using Y'; trace logs a FALLBACK line and quick-completion status shows the same reason — no silent switching"
        tags: [router, fallback, transparency, trace]
      - id: A77
        problem: "prompt was wiped on process death — only rotation survived"
        cause: "ViewModel state lived purely in memory; only MainActivity used rememberSaveable for two booleans"
        solution: "EngineViewModel takes SavedStateHandle (default arg keeps tests working) and persists the prompt key on set/clear; model selection already survives via prefs — golden UX P0 now covers process death"
        tags: [state, survival, savedstate, viewmodel]
      - id: A78
        problem: "source chunks were never written into the HNSW vector index, so the hybrid search was search-only plumbing"
        cause: "no chunk-id listing API and no ingest-time wiring; the embedding gate was always closed"
        solution: "SourceStore.chunksForFile(fileId) (Android SQLite + JDBC twin + fake); SourceUpdater.indexChunksIfReady embeds + adds chunks at all five ingest paths only when index AND embedder report available (dormant until the EMBEDDINGS.md benchmark gate opens); ingest never fails on vector writes"
        tags: [sources, embeddings, ingest, usearch, gating]
      - id: A79
        problem: "skills were wired into the agent but users had no way to manage them (Phase 10 UI missing)"
        cause: "SkillManager/SkillStorage existed with no create/edit/delete surface and no built-in protection"
        solution: "Skill gains a builtin flag (seeds read-only); SkillManager.delete refuses built-ins; ENGINE SETTINGS gains a SKILLS panel with SEEDED/CUSTOM badges, create/edit/delete via a small editor dialog (id/purpose/tools/workflow/constraints), JSON-persisted; empty list re-seeds defaults"
        tags: [skills, ui, phase10, editor]
      - id: A80
        problem: "the verified learning dataset pipeline had no UI and no honest eligibility surfacing"
        cause: "SelfLearningPipeline existed but nothing called it; minPairs was private"
        solution: "Diagnostics gains 'Export dataset': runs export + dedupe + min-pair gate, shows dataset file/pairs/reason and LoRA eligibility reasons (never silently trains); minPairs made public for the report"
        tags: [learning, dataset, diagnostics, eligibility]
      - id: A81
        problem: "Context-bound state (SharedPrefs) had no JVM test coverage"
        cause: "no Robolectric in the test toolchain"
        solution: "testImplementation Robolectric 4.12.2 + androidx.test:core + unitTests.includeAndroidResources; ModelPreferencesRobolectricTest covers selection/override/terminal persistence, null override semantics, favorites toggle — test-only, no APK impact"
        tags: [testing, robolectric, prefs, ci]
      - id: A82
        problem: "the golden source catalog covered only 6 layers and lacked agent-tooling and build/CI references"
        cause: "catalog grew from earlier prompts without the maintenance-phase lens"
        solution: "catalog v3: sections 7 (agent/tooling patterns, REF-only) and 8 (build/CI/release) + new entries (mediapipe, tokenizers, commons-compress, readability, LocalAI, ollama, timber, curtains, coil, kotlinx-serialization, Tink, cache-fix, emulator-runner, fastlane, macrobenchmark); Robolectric marked IN; adoption order updated"
        tags: [catalog, licensing, build, ci, reference]
      - id: A83
        problem: "ci/sources-fmhy-site was a wrong push: golden wave (VM refactor, approvals, skills, integrity, dataset export) unrelated to FMHY"
        cause: "previous run conflated a large engine/UX refactor with the small FMHY source change; ~90% of the diff was out of scope"
        solution: "delete local + remote branch; main stays the source of truth; one branch = one scoped feature; land golden wave directly on main"
        tags: [git, branch-hygiene, scope, workflow]
      - id: A84
        problem: "GitHub banner: main branch isn't protected; force-push/delete and unchecked merges possible"
        cause: "no branch-protection rule on the default branch (API 404 Branch not protected)"
        solution: "classic protection on main: required status check 'build', no force pushes, no deletions, enforce_admins false; direct pushes stay allowed"
        tags: [github, branch-protection, ci, safety]
      - id: A85
        problem: "main's seed catalog still had LiteRT/Termux/llama.cpp/uBlock/MemPalace and no FMHY"
        cause: "SITE-type FMHY only existed on the deleted branch; main has no SourceType.SITE"
        solution: "sources.json -> FMHY (GITHUB_REPO fmhy/FMHY) + playbook only; ROADMAP S4 updated; CI green on main"
        tags: [sources, catalog, fmhy, assets]
      - id: A86
        problem: "250 JVM tests ran but 5 failed on CI: ContextManagerTest/MemoryBudgetTest initializationError, ModelManifestTest ComparisonFailure, 2 SourceUpdaterTest site asserts"
        cause: "1) tests appended after a premature class-closing brace sat outside the class (JUnit reflection fails); 2) ModelManifest.record lowercases sha256, test expected uppercase; 3) siteFilePath checked path.contains('.') on host+path, so fmhy.net/ai got no .html and shouldIngest rejected ext 'net/ai'"
        solution: "remove premature braces (re-close at EOF); assert lowercase sha (abc123); extension detection on final path segment only (path.substringAfterLast('/')) so fmhy.net/ai.html is ingestible; run testDebugUnitTest in CI before merge"
        tags: [testing, kotlin, structure, sources, ci]
      - id: A87
        problem: "installing a CI APK onto the OP7 from proot: /sdcard is isolated, shizuku forwards no stdin and shares no paths, argv base64 hits ARG_MAX"
        cause: "proot rootfs is isolated from the real Android filesystem; host-bridge shizuku only accepts a JSON command string"
        solution: "python3 -m http.server bound to 0.0.0.0 in proot + shizuku sh -c 'curl -s -o /sdcard/...' (device and proot share wlan0); verify SHA-256 first"
        tags: [install, shizuku, proot, apk, transfer]
      - id: A88
        problem: "pm install -r failed: INSTALL_FAILED_UPDATE_INCOMPATIBLE signatures do not match"
        cause: "new CI keystore rotation changed the signing cert (6085c8a0 -> 415940f0)"
        solution: "uninstall + reinstall is the signature-rotation path; GGUF models live in /sdcard/Download (scoped storage) so they survive uninstall; stage APK in /data/local/tmp"
        tags: [install, signature, keystore, scoped-storage]
      - id: A89
        problem: "app header hardcoded SD855 8 GB while GOLD-STANDARD-SPEC says RAM 6-8 GB device variants"
        cause: "EngineScreen.kt:505 literal"
        solution: "chip now reads SD855 6-8 GB; README + spec already correct"
        tags: [hardware, golden-standard, ui, spec]
      - id: A90
        problem: "agent fallback silently swapped the user's model kind: a failed local pick could be replaced by a free remote (whose anonymous rate-limit error then appeared as if the user chose it)"
        cause: "ThinkingAgent fallback called router.route(task, registry, excludeIds) with no kind preference; ModelRouter had no preferKind seam; sendQuick showed raw provider errors"
        solution: "ModelRouter.route gained preferKind (same-kind candidates tried first, full pool only when none remain); ThinkingAgent passes the failed model's kind and always emits an honest Routed(reason); VM translates known provider errors (rate-limit/401/timeout/network) into actionable text"
        tags: [router, agent, fallback, error-handling, golden-standard]
      - id: A91
        problem: "web_search was a stub (LocalFallbackProvider) but the TOOL INVENTORY rendered AVAILABLE — a fake capability"
        cause: "ToolRegistry.snapshot() only reflected AgentTool.available (default true); WebSearchTool never gated on a configured provider"
        solution: "SearchProvider.configured (default true, fallback false); WebSearchTool.available = configured with unavailableReason; AgentTool/ToolDescriptor gained unavailableReason; inventory shows NOT CONFIGURED + reason line; web_search additionally reports OFFLINE when the network is down"
        tags: [tools, web-search, honest-state, ui]
      - id: A92
        problem: "no real follow-up continuity: every send started a new session, answers were only saved on AgentEvent.Final, and stopped/failed runs broke the thread"
        cause: "EngineViewModel created a fresh session per run and ended it in finally; sendQuick never persisted; priorConversation read recentMessages() in DESC order"
        solution: "one activeSessionId reused by sendQuick + runAgent (Clear closes it = new conversation); exchange saved on success, error and stop; MemoryDatabase.conversationTail() returns chronological order for prior-turn context"
        tags: [memory, sessions, continuity, agent, ux]
      - id: A93
        problem: "user had no choice where memory/models live; paths were hardcoded to filesDir"
        cause: "MemoryDatabase('memory.db') fixed to app-private databases dir; EngineScreen/MainActivity hardcoded filesDir/models; no SAF path picker"
        solution: "StoragePaths (dataDir/modelsDir/catalogFile/memoryDbPath/treeToAppPath/label) is the single resolution point; prefs gained dataDirOverride/modelsDirOverride; ENGINE SETTINGS → STORAGE rows with Internal/External/Pick (OpenDocumentTree, app-scoped only — scoped-storage honesty); models-dir changes apply live (library rebuild + VM re-attach), data-dir changes require restart (DB opened at startup)"
        tags: [storage, scoped-storage, saf, prefs, settings]
      - id: A94
        problem: "sources were metadata-only: rows had Refresh/Delete but no way to read the indexed knowledge"
        cause: "SourcesScreen rendered SourceRow without content access; search hits were not clickable"
        solution: "View button on every source row + clickable KNOWLEDGE HITS → SourceViewerDialog (file list, expandable chunks with show-more, copy-all); SourceStore gained sourceFileById (MemoryDatabase + JdbcSourceStore twin)"
        tags: [sources, knowledge-base, ui, reader]
      - id: A95
        problem: "GGUF manual import showed only a text status, no progress or failure toast"
        cause: "LocalModelImporter existed but EngineScreen didn't surface fraction or snackbar errors"
        solution: "importProgress Float? drives a LinearProgressIndicator; unknown-size imports show (unknown size); failures notify via snackbar; success message points to Load Model"
        tags: [import, gguf, progress, ux]
      - id: A96
        problem: "TOOL INVENTORY was static and disconnected from offline/online + model state"
        cause: "snapshot() rendered once; no network/termux overlay"
        solution: "live toolRows recomputed on network/termux/selection/models-dir changes; networkOnline refreshed every 3s while the settings sheet is open; web_search → NOT CONFIGURED/OFFLINE, terminal reasons surfaced via unavailableReason"
        tags: [tools, inventory, offline, connectivity, ui]
