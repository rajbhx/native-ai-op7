# native-ai-op7 field-notes journal — machine-readable source of truth.
# The playbook sync (rajbhx/op7-special-build-playbook) consumes this.
sections:
  - id: A
    title: CI & build pipeline
    entries:
      - id: A1
        problem: "llama.cpp submodule tag checkout fails in a shallow clone ('origin/b10428 is not a commit')"
        cause: "--depth 1 --branch <tag> fetches only the default branch, so release tags are absent"
        solution: "submodule add shallow, then fetch --depth 1 origin tag b10428 + checkout + git add the gitlink"
        tags: [submodule, llama.cpp, git]
      - id: A2
        problem: "'E: Unable to locate package shaderc' on the Ubuntu 24.04 runner"
        cause: "shaderc was restructured in noble; llama.cpp's own CI uses glslc + spirv-headers"
        solution: "apt-get install -y glslc libvulkan-dev spirv-headers"
        tags: [vulkan, github-actions, llama.cpp]
      - id: A3
        problem: "'GGML_CPU_ALL_VARIANTS requires GGML_BACKEND_DL' at CMake configure"
        cause: "llama.cpp gates ALL_VARIANTS behind dynamic backend loading (ggml/src/CMakeLists.txt:373)"
        solution: "set GGML_BACKEND_DL=ON together with GGML_CPU_ALL_VARIANTS=ON (mirrors llama.cpp build-android.yml)"
        tags: [cmake, llama.cpp, github-actions]
      - id: A4
        problem: "'Inconsistent JVM-target compatibility (1.8 vs 17)' fails compileDebugKotlin"
        cause: "AGP defaults Java target 1.8 while Kotlin jvmTarget defaulted to 17"
        solution: "compileOptions VERSION_17 + kotlinOptions { jvmTarget = \"17\" } inside android {}"
        tags: [gradle, kotlin, jvm]
      - id: A5
        problem: "'Unresolved reference ... BaseAppModuleExtension.kotlinOptions' in build.gradle.kts"
        cause: "kotlinOptions used at top level instead of scoped inside the android {} extension"
        solution: "move the block inside android {}"
        tags: [gradle, kotlin]
      - id: A6
        problem: "'no matching function for call to llama_memory_clear' at b10428"
        cause: "KV-cache API refactor — memory ops take a llama_memory_t handle, not the context"
        solution: "llama_memory_clear(llama_get_memory(g_ctx), false) with null guard"
        tags: [llama.cpp, api, kv-cache]
      - id: A7
        problem: "lifecycleScope unresolved in MainActivity (receiver mismatch)"
        cause: "lifecycleScope is a LifecycleOwner extension; plain Activity is not a LifecycleOwner"
        solution: "own CoroutineScope(SupervisorJob() + Dispatchers.Main), cancel in onDestroy, drop lifecycle-runtime-ktx"
        tags: [kotlin, android, lifecycle]
      - id: A8
        problem: "llama_load_model_from_file / llama_free_model deprecated at b10428"
        cause: "llama.cpp renamed the model API (llama_model_load_from_file / llama_model_free)"
        solution: "use the current names, verified against the pinned header"
        tags: [llama.cpp, api]
      - id: A9
        problem: "sampler chain params at b10428 carry only no_perf — penalties missing"
        cause: "llama_sampler_chain_params has just no_perf; penalties are a separate sampler object"
        solution: "add llama_sampler_init_penalties(n_vocab, last_n, repeat, 0, 0) to the chain before top_k/top_p/temp/dist"
        tags: [llama.cpp, sampling]
      - id: A10
        problem: "SafeExpr compile error: 'inferred type is () -> Int but SafeExpr.Ref was expected'"
        cause: "parseExpr called with a trailing lambda { pos } instead of the Ref holder"
        solution: "val pos = Ref(0); parseExpr(tokens, pos); check pos.value != tokens.size"
        tags: [kotlin, parser, tests]
      - id: A11
        problem: "Redeclaration: ToolResult + 'Cannot find a parameter with this name: id/inputHash'"
        cause: "agent tool result duplicated the Phase 2 DB record name ToolResult (MemoryModels.kt)"
        solution: "rename tool-execution result to ToolOutput; the DB record keeps ToolResult"
        tags: [kotlin, naming, agent]
      - id: A12
        problem: "'Returns are not allowed for functions with expression body' in parseSseEvent"
        cause: "unlabeled return null inside fun ... = try { }"
        solution: "make the if/else the try value; no bare return"
        tags: [kotlin, sse, openai]
      - id: A13
        problem: "'Smart cast to ModelDescriptor is impossible — captured by a changing closure'"
        cause: "nullable var reassigned inside a catch while read inside flow lambdas"
        solution: "non-null via ?: run { emit(Error); return@flow }; var stays non-null"
        tags: [kotlin, smart-cast, agent]
      - id: A14
        problem: "ld.lld: undefined symbol ggml_threadpool_new / ggml_threadpool_free"
        cause: "threadpool API lives in the CPU backend (ggml-cpu.c), dlopen'd under GGML_BACKEND_DL=ON — not linkable from native-lib"
        solution: "pin the calling decode thread before first graph compute; pthreads inherit creator affinity; no direct ggml-cpu link; -llog for logcat"
        tags: [llama.cpp, affinity, linker]
      - id: A15
        problem: "setContent in MainActivity: 'receiver type mismatch'"
        cause: "androidx.activity.compose.setContent is a ComponentActivity extension; activity extended plain android.app.Activity"
        solution: "extend androidx.activity.ComponentActivity"
        tags: [compose, kotlin, activity]
      - id: A16
        problem: "memory retrieval ranked by hand-rolled linear recency, not the spec's BM25 × exponential decay"
        cause: "Phase 2 scoring predated the math spec (score = utility*0.5 + recency*0.3 + success*0.2)"
        solution: "ftsCandidates selects bm25(experiences_fts) AS bm25_rank; score = -rank * exp(-0.05*ageDays) + small tiebreaks; decay SQL lambda 0.02 -> 0.05"
        tags: [sqlite, fts5, ranking, math]
      - id: A17
        problem: "FGS specialUse requires both the permission and the subtype property at targetSdk 34"
        cause: "Android 14 introduced FOREGROUND_SERVICE_SPECIAL_USE with a required PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
        solution: "declare FOREGROUND_SERVICE + FOREGROUND_SERVICE_SPECIAL_USE + POST_NOTIFICATIONS; service foregroundServiceType=specialUse + property; request POST_NOTIFICATIONS at runtime (API 33+)"
        tags: [android, foreground-service, manifest]
      - id: A18
        problem: "setup-java v4 deprecation annotation; web_search ok flag coupled to a magic string"
        cause: "actions/setup-java@v4 is deprecated; WebSearchTool checked result.startsWith('web search unavailable')"
        solution: "migrate to actions/setup-java@v5; SearchProvider returns SearchResult(text, ok), LocalFallbackProvider ok=false; playbook phase 5 marked done"
        tags: [github-actions, agent, playbook, kotlin]
      - id: A19
        problem: "local llama.cpp init fails on-device: 'no backends are loaded'"
        cause: "AGP default extractNativeLibs=false packs .so in APK so nativeLibraryDir is empty; ggml_backend_load_all() searched exec dir + cwd only"
        solution: "android:extractNativeLibs=true + ggml_backend_load_all_from_path(nativeLibraryDir) before llama_backend_init; verified on-device init OK (RSS 729 MB, Qwen0.5B Q4_K_M, contended)"
        tags: [llama.cpp, ggml, android, jni, apk]
      - id: A20
        problem: "Agent button crash: SQLiteException no such module: fts5"
        cause: "OP7 OxygenOS Android 10 SQLite lacks the FTS5 extension; MemoryDatabase.onCreate DDL failed and startSession ran outside try/catch -> uncaught coroutine crash"
        solution: "detect FTS5 availability (try/catch DDL), fall back to bounded LIKE term-hit retrieval; wrap startSession/endSession so memory failure degrades gracefully"
        tags: [sqlite, fts5, memory, crash, oneplus]
      - id: A21
        problem: "Agent unusable: persisted remote provider not re-registered after restart; local model required manual pre-load"
        cause: "providers registered only on picker selection; runAgent early-returned for unloaded local; messages not actionable"
        solution: "re-register persisted remote at startup; auto-load local GGUF on Agent/Generate; add in-app GGUF downloader (space check, magic verify, tmp+rename) + context selector; industrial UI redesign with real engine-state header"
        tags: [agent, router, models, download, ui, compose]
      - id: A22
        problem: "UI implied free remote models require an API key"
        cause: "health() hard-failed on blank key; Zen anonymous billing source is actually supported (per-IP rate-limited)"
        solution: "health() treats anonymous as healthy; omit Authorization when key blank; 429 -> actionable message; UI shows amber 'Free · anonymous (rate-limited)' and dialog clarifies keys only raise the quota"
        tags: [zen, api-key, free-tier, anonymous, rate-limit]
      - id: A23
        problem: "evaluate LiteRT/LiteRT-LM as a faster local inference backend for OP7"
        cause: "LiteRT-LM (Google AI Edge, ex-TFLite) advertises GPU/NPU LLM acceleration, tool use, on-device LoRA; local 1B Q4 is ~1.8 tok/s (contended)"
        solution: "audited upstream (v0.16.0); parked as reference only (ADR-007 + docs/source-research/litert-lm.md) because runtime is .tflite/.litertlm with no GGUF path — replacing llama.cpp needs a new export pipeline + second runtime and risks the 1.5 GB gate. Revisit on triggers: memory embedder via TFLite, same-device benchmark win, Phase 9 LoRA"
        tags: [litert, tflite, inference, adr, reference]
      - id: A24
        problem: "remote quick-send/Agent showed ERROR 'generate failed: Flow exception transparency is violated' and produced zero tokens"
        cause: "OpenAICompatibleProvider emitted ModelStreamEvent.Error from a bare catch block AND emitted inside withContext(Dispatchers.IO) within the flow builder; kotlinx.coroutines 1.8 bans emit in a context different from the collection context (FlowExceptionTransparencyViolatedException), killing the whole stream"
        solution: "stream() = flow { HTTP/SSE work }.flowOn(Dispatchers.IO) + .catch { emit(Error) } - never emit inside withContext/catch inside a builder; regression tests (unreachable endpoint -> Error event; local ServerSocket SSE stub -> tokens then Done); reproduced locally with kotlinc + kotlinx-coroutines-core-jvm + org.json jars before burning CI cycles"
        tags: [kotlinx-coroutines, flow, sse, provider, crash, kotlin]
      - id: A25
        problem: "pm install -r -d -t failed INSTALL_FAILED_UPDATE_INCOMPATIBLE on every CI APK; certs drifted run-to-run (0b045c7c/64ced54c/7f721a2c) vs persistent 21add73b"
        cause: "AGP silently regenerated a random debug keystore each run despite the restored ~/.android/debug.keystore (JDK17 default keystore type is PKCS12 so a JKS fails to load; explicit signingConfig also failed to load it) - only the installed app's original key allows in-place update"
        solution: "pragmatic, per user decision: accept the new signature - pm uninstall + pm install -t + restore model from /sdcard/Download/nativeai-model-backup.gguf via 'run-as com.engine.nativeai sh -c cat > files/models/model.gguf' (app uid CAN read /sdcard/Download); keep DEBUG_KEYSTORE_BASE64 restore + keytool validation in the workflow but do not gate builds on it"
        tags: [signing, keystore, install, apk, ci, data-wipe]
      - id: A26
        problem: "cannot push files (APK) to the device from the proot shell: proot /storage/emulated/0/1DMP is an ext4 image not visible to the device shell; proot /tmp differs; adb unusable (127.0.0.1:5555 timeout); SELinux blocks pm from reading /sdcard"
        cause: "proot rootfs is a separate filesystem; device shell sees the real /storage/emulated/0/1DMP (1DM download folder); host-bridge shizuku has no root"
        solution: "python3 -m http.server 8000 --bind 0.0.0.0 inside a persistent exec session + device 'curl -o /data/local/tmp/x.apk http://192.168.1.3:8000/x.apk' + 'pm install -t /data/local/tmp/x.apk'; model restore via run-as cat from /sdcard/Download (verified READ_OK)"
        tags: [install, transfer, proot, shizuku, apk, oneplus]
      - id: A27
        problem: "Track A compile: 'Unresolved reference: EngineServiceState' + 'Comparison of incompatible enums'"
        cause: "enum declared INSIDE the companion object is not promoted to the outer class name (only members are); Class.EngineServiceState fails to resolve"
        solution: "declare EngineServiceState at top level of the service file; reference EngineServiceState.STOPPED directly"
        tags: [kotlin, enum, companion, compile]
      - id: A28
        problem: "Track E compile: 'Unresolved reference: context' in ExecutionManager.backend()"
        cause: "a constructor parameter without val/var is only visible in property initializers/init, not in method bodies"
        solution: "class ExecutionManager(private val context: Context)"
        tags: [kotlin, constructor, compile]
      - id: A29
        problem: "JVM tests: ExecutionLayerTestKt > initializationError InvalidTestClassError"
        cause: "appended JUnit test landed OUTSIDE the class (after the closing brace) -> top-level @Test in the file facade ExecutionLayerTestKt, which JUnit rejects"
        solution: "keep every @Test inside the class body; verify with tail -n before pushing (104 tests now green)"
        tags: [junit, kotlin, test, compile]
      - id: A30
        problem: "Termux execution absent at the core execution layer; user wants it core-level, optional Anyclaw/Codex/OpenCode later"
        cause: "audit had parked TermuxBackend; only LocalProcessBackend existed"
        solution: "TermuxBackend (clean-room): com.termux detection + RunCommandService intent (com.termux.RUN_COMMAND) + file exchange /sdcard/Download/nativeai/<runId>/; TermuxStatus machine with honest reasons; ExecutionManager (Termux READY ? termux : local); Tools settings row; terminalEnabled/terminalAllowlist prefs; READ_EXTERNAL_STORAGE maxSdk 32 + MediaStore fallback for API 33+. One-time user setup: termux-setup-storage + Allow external apps"
        tags: [termux, execution, intent, tool, backend, memory]
      - id: A31
        problem: "tools invisible/uncontrolled; no inventory contract between ToolRegistry and UI"
        cause: "ToolRegistry exposed only descriptions(); settings had just the terminal row"
        solution: "ToolDescriptor + ToolRegistry.snapshot() + shared Toolbox (one construction path for agent and settings); Tools section shows every tool with AVAILABLE/DISABLED/APPROVAL/PRIVILEGED badges"
        tags: [tools, registry, ui, inventory]
      - id: A32
        problem: "agent trace could not prove which execution backend ran a terminal command"
        cause: "TerminalTool output had no backend marker"
        solution: "AgentTool.backendLabel (termux/local) + TerminalTool prefixes observations with [termux]/[local]"
        tags: [trace, termux, observability]
      - id: A33
        problem: "no authoritative model status line; quota static until manual health press; no system prompt override; Stats lacked affinity + dynamic budget"
        cause: "no derived status, no auto health refresh, hardcoded system prompt, affinity pin result only logged"
        solution: "ModelStatus.line() (READY/AVAILABLE/NO MODEL FILE/ONLINE/OFFLINE) + auto health 60s cache + persisted systemPromptOverride (ThinkingAgent + quick-send) + affinity_applied in native stats JSON + Stats budget/max-ctx lines"
        tags: [model, state, health, system-prompt, affinity, stats]
      - id: A34
        problem: "schema v3 onUpgrade was a dev reset - every update dropped the whole memory DB (experiences/facts/messages)"
        cause: "onUpgrade called DROP TABLE + onCreate as a dev shortcut"
        solution: "SCHEMA_VERSION 4 + real migration: v3->v4 keeps all existing tables and only adds source KB tables (source_collections, sources, source_files, source_chunks + external FTS5 source_chunks_fts with triggers); SourceSchema holds pure DDL strings shared with the JVM sqlite-jdbc twin; migration-retention test proves old rows survive"
        tags: [sqlite, migration, schema, sources]
      - id: A35
        problem: "source registry/updater logic untestable on JVM because MemoryDatabase extends Android SQLiteOpenHelper"
        cause: "no storage contract; only the Android implementation existed"
        solution: "SourceStore interface implemented by MemoryDatabase (device) and JdbcSourceStore (test-only org.xerial:sqlite-jdbc, bundles FTS5) running the exact SourceSchema DDL; FakeSourceStore for unit tests; tests for migration retention, chunker bounds, candidate staleness order, 304 conditional fetch, changed-blob-only, read-time eviction, BM25 + LIKE search"
        tags: [testing, sqlite-jdbc, jvm, sources]
      - id: A36
        problem: "RAW_TEXT sources errored on the periodic refresh (marked ERROR)"
        cause: "updateSourceInternal dispatched RAW_TEXT to the HTTP path, which requires a contentUrl"
        solution: "RAW_TEXT skipped in the updater - it is indexed once on add via db.replaceSourceChunks"
        tags: [sources, updater, bug]
      - id: A37
        problem: "chunk overlap disappeared after the word-boundary refactor"
        cause: "loop advanced start = end (no overlap), losing boundary context between chunks"
        solution: "advance start = end - overlapChars with a progress guard; SourceChunkerTest asserts consecutive chunks share words"
        tags: [chunker, retrieval]
      - id: A38
        problem: "future memory/Source-KB phases lacked a reference for scoped verbatim memory + pluggable retrieval"
        cause: "user pointed at MemPalace/mempalace (MIT) as a source of ideas for later phases"
        solution: "recorded docs/source-research/mempalace-reference.md: scoped hierarchy (wings/rooms/drawers) maps to collections/sources/files-chunks; pluggable backend seam matches SourceStore/MemoryProvider; hybrid keyword fallback validates FTS5+LIKE; embedder sizes (~80 MB minilm) give ADR-007 a real budget figure; LongMemEval R@5 as a future benchmark; keep read_time eviction for verbatim-growth control"
        tags: [memory, sources, reference, research]
      - id: A39
        problem: "local model support was hardcoded to one fixed path (models/model.gguf) in nine EngineScreen call sites; multiple GGUFs were impossible and LocalModelProvider always exposed descriptor id local-llama"
        cause: "MainActivity registered one LocalModelProvider; UI built modelFile from a fixed path; provider descriptor was a constant, so per-file providers would collide"
        solution: "LocalModelLibrary (pure JVM) scans models/*.gguf with stable ids (model.gguf -> local-llama, others -> local-<stem>); descriptor-override param on LocalModelProvider so each file gets its own provider sharing one NativeEngine; syncInto drops deleted files and keeps a local-llama placeholder when empty; LocalModelImporter (SAF) with progress + StatFs +64 MB margin + GGUF magic guard + temp rename; RemoteProviderBootstrap skips all local-* ids; picker '＋ Pick GGUF from storage…' row + size/quant subtitles; model card Delete; loadedPath guard reloads on model switch"
        tags: [models, local, gguf, saf, multi-model]
      - id: A40
        problem: "no observability: AgentEvent lacked timestamps/durations, tool timings and tok/s were untracked, Stats only dumped memoryStats() to the status line"
        cause: "no metrics contract; trace events were plain data; no jank/leak tooling"
        solution: "RuntimeMetrics (load, first-token, tok/s, per-tool, errors/retries, restarts, jank) + DiagnosticsProvider/RuntimeDiagnostics + DiagnosticsDialog; AgentEvent atMs/durationMs with timestamped trace lines (TraceLine strips the prefix); FrameJankMonitor (Choreographer, no dep); LeakCanary debugImplementation only; .maestro/acceptance flows on the physical device (arm64-only APK cannot run on x86_64 CI emulators); docs/source-research/perf-observability-reference.md + license review rows"
        tags: [observability, metrics, diagnostics, jank, leakcanary, maestro]
      - id: A41
        problem: "Engine Settings bottom sheet did not scroll on the phone (1080x2400): HARDWARE TUNING, Start service, Download GGUF, Stats and TOOL INVENTORY sat below the fold and were unreachable, so the buttons looked 'missing' and Download/Stats could not be exercised"
        cause: "ModalBottomSheet body Column had no scroll modifier; the sheet is full-height (skipPartiallyExpanded), so taller-than-screen content was clipped"
        solution: "added .verticalScroll(rememberScrollState()) to the sheet Column"
        tags: [ux, bottom-sheet, scroll, settings, buttons]
      - id: A42
        problem: "app SIGSEGV'd (native, fault addr 0x0) in ggml_compute_forward_rope (libggml-cpu-android_armv8.2_2.so) ~2 s after 'agent stopped' while running Qwen2.5-0.5B locally, killing the whole process (engine service runs in the same process)"
        cause: "stopRun() called runJob.cancel() but immediately released running/runJob; local generation is a blocking llama.cpp decode inside callbackFlow, so coroutine cancellation only closes the flow (which fires nativeCancel) and the native loop unwinds on the next sampled token (~0.5-1 s); starting a new run in that window overlapped two generations on one llama_context, corrupting the graph"
        solution: "stopRun() now calls engine.cancel() first (stops the native loop promptly) and keeps running=true until the job's finally unwinds, so a new run can never overlap a still-decoding engine; both quick-send and agent paths reset running in finally"
        tags: [crash, sigsegv, rope, stop, concurrency, native, llama]
      - id: A43
        problem: "startup status line was a stale constant ('Engine library loaded. Put a GGUF in: …') shown even when models/model.gguf existed"
        cause: "status was initialized once with a fixed string, never reflecting the actual library scan"
        solution: "initialize from LocalModelLibrary.scan(): empty -> guidance to Download/import; non-empty -> 'Local library ready: <files>'"
        tags: [ux, status, local-library, contradiction]
      - id: A44
        problem: "pm install -r of the CI build failed INSTALL_FAILED_UPDATE_INCOMPATIBLE (signatures do not match) even though the workflow restores DEBUG_KEYSTORE_BASE64"
        cause: "the installed app predates the current persistent keystore value; the secret was rotated/replaced at some point, so the old and new debug keys differ"
        solution: "one-time pm uninstall + reinstall (app data loss), re-stage the GGUF via run-as; future builds signed with the same secret update in place — verify with the next install before trusting 'persistent'"
        tags: [ci, keystore, install, signature, update-incompatible]
      - id: A45
        problem: "pushing code fix + docs back-to-back cancelled the code CI build"
        cause: "build.yml concurrency group build-<ref> with cancel-in-progress: true cancels the previous run on every push"
        solution: "push code first, wait for its run to finish (or at least pass the build job) before pushing docs; only the latest HEAD build matters"
        tags: [ci, github-actions, concurrency, cancel]
