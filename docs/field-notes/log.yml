# native-ai-op7 field-notes journal — machine-readable source of truth.
# The playbook sync (rajbhx/op7-special-build-playbook) consumes this.
sections:
  - id: A
    title: CI & build pipeline
    entries:
      - id: A1
        problem: "llama.cpp submodule tag checkout fails in a shallow clone ('origin/b10428 is not a commit')"
        cause: "--depth 1 --branch <tag> fetches only the default branch, so release tags are absent"
        solution: "submodule add shallow, then fetch --depth 1 origin tag b10428 + checkout + git add the gitlink"
        tags: [submodule, llama.cpp, git]
      - id: A2
        problem: "'E: Unable to locate package shaderc' on the Ubuntu 24.04 runner"
        cause: "shaderc was restructured in noble; llama.cpp's own CI uses glslc + spirv-headers"
        solution: "apt-get install -y glslc libvulkan-dev spirv-headers"
        tags: [vulkan, github-actions, llama.cpp]
      - id: A3
        problem: "'GGML_CPU_ALL_VARIANTS requires GGML_BACKEND_DL' at CMake configure"
        cause: "llama.cpp gates ALL_VARIANTS behind dynamic backend loading (ggml/src/CMakeLists.txt:373)"
        solution: "set GGML_BACKEND_DL=ON together with GGML_CPU_ALL_VARIANTS=ON (mirrors llama.cpp build-android.yml)"
        tags: [cmake, llama.cpp, github-actions]
      - id: A4
        problem: "'Inconsistent JVM-target compatibility (1.8 vs 17)' fails compileDebugKotlin"
        cause: "AGP defaults Java target 1.8 while Kotlin jvmTarget defaulted to 17"
        solution: "compileOptions VERSION_17 + kotlinOptions { jvmTarget = \"17\" } inside android {}"
        tags: [gradle, kotlin, jvm]
      - id: A5
        problem: "'Unresolved reference ... BaseAppModuleExtension.kotlinOptions' in build.gradle.kts"
        cause: "kotlinOptions used at top level instead of scoped inside the android {} extension"
        solution: "move the block inside android {}"
        tags: [gradle, kotlin]
      - id: A6
        problem: "'no matching function for call to llama_memory_clear' at b10428"
        cause: "KV-cache API refactor — memory ops take a llama_memory_t handle, not the context"
        solution: "llama_memory_clear(llama_get_memory(g_ctx), false) with null guard"
        tags: [llama.cpp, api, kv-cache]
      - id: A7
        problem: "lifecycleScope unresolved in MainActivity (receiver mismatch)"
        cause: "lifecycleScope is a LifecycleOwner extension; plain Activity is not a LifecycleOwner"
        solution: "own CoroutineScope(SupervisorJob() + Dispatchers.Main), cancel in onDestroy, drop lifecycle-runtime-ktx"
        tags: [kotlin, android, lifecycle]
      - id: A8
        problem: "llama_load_model_from_file / llama_free_model deprecated at b10428"
        cause: "llama.cpp renamed the model API (llama_model_load_from_file / llama_model_free)"
        solution: "use the current names, verified against the pinned header"
        tags: [llama.cpp, api]
      - id: A9
        problem: "sampler chain params at b10428 carry only no_perf — penalties missing"
        cause: "llama_sampler_chain_params has just no_perf; penalties are a separate sampler object"
        solution: "add llama_sampler_init_penalties(n_vocab, last_n, repeat, 0, 0) to the chain before top_k/top_p/temp/dist"
        tags: [llama.cpp, sampling]
      - id: A10
        problem: "SafeExpr compile error: 'inferred type is () -> Int but SafeExpr.Ref was expected'"
        cause: "parseExpr called with a trailing lambda { pos } instead of the Ref holder"
        solution: "val pos = Ref(0); parseExpr(tokens, pos); check pos.value != tokens.size"
        tags: [kotlin, parser, tests]
      - id: A11
        problem: "Redeclaration: ToolResult + 'Cannot find a parameter with this name: id/inputHash'"
        cause: "agent tool result duplicated the Phase 2 DB record name ToolResult (MemoryModels.kt)"
        solution: "rename tool-execution result to ToolOutput; the DB record keeps ToolResult"
        tags: [kotlin, naming, agent]
      - id: A12
        problem: "'Returns are not allowed for functions with expression body' in parseSseEvent"
        cause: "unlabeled return null inside fun ... = try { }"
        solution: "make the if/else the try value; no bare return"
        tags: [kotlin, sse, openai]
      - id: A13
        problem: "'Smart cast to ModelDescriptor is impossible — captured by a changing closure'"
        cause: "nullable var reassigned inside a catch while read inside flow lambdas"
        solution: "non-null via ?: run { emit(Error); return@flow }; var stays non-null"
        tags: [kotlin, smart-cast, agent]
      - id: A14
        problem: "ld.lld: undefined symbol ggml_threadpool_new / ggml_threadpool_free"
        cause: "threadpool API lives in the CPU backend (ggml-cpu.c), dlopen'd under GGML_BACKEND_DL=ON — not linkable from native-lib"
        solution: "pin the calling decode thread before first graph compute; pthreads inherit creator affinity; no direct ggml-cpu link; -llog for logcat"
        tags: [llama.cpp, affinity, linker]
      - id: A15
        problem: "setContent in MainActivity: 'receiver type mismatch'"
        cause: "androidx.activity.compose.setContent is a ComponentActivity extension; activity extended plain android.app.Activity"
        solution: "extend androidx.activity.ComponentActivity"
        tags: [compose, kotlin, activity]
      - id: A16
        problem: "memory retrieval ranked by hand-rolled linear recency, not the spec's BM25 × exponential decay"
        cause: "Phase 2 scoring predated the math spec (score = utility*0.5 + recency*0.3 + success*0.2)"
        solution: "ftsCandidates selects bm25(experiences_fts) AS bm25_rank; score = -rank * exp(-0.05*ageDays) + small tiebreaks; decay SQL lambda 0.02 -> 0.05"
        tags: [sqlite, fts5, ranking, math]
      - id: A17
        problem: "FGS specialUse requires both the permission and the subtype property at targetSdk 34"
        cause: "Android 14 introduced FOREGROUND_SERVICE_SPECIAL_USE with a required PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
        solution: "declare FOREGROUND_SERVICE + FOREGROUND_SERVICE_SPECIAL_USE + POST_NOTIFICATIONS; service foregroundServiceType=specialUse + property; request POST_NOTIFICATIONS at runtime (API 33+)"
        tags: [android, foreground-service, manifest]
      - id: A18
        problem: "setup-java v4 deprecation annotation; web_search ok flag coupled to a magic string"
        cause: "actions/setup-java@v4 is deprecated; WebSearchTool checked result.startsWith('web search unavailable')"
        solution: "migrate to actions/setup-java@v5; SearchProvider returns SearchResult(text, ok), LocalFallbackProvider ok=false; playbook phase 5 marked done"
        tags: [github-actions, agent, playbook, kotlin]
      - id: A19
        problem: "local llama.cpp init fails on-device: 'no backends are loaded'"
        cause: "AGP default extractNativeLibs=false packs .so in APK so nativeLibraryDir is empty; ggml_backend_load_all() searched exec dir + cwd only"
        solution: "android:extractNativeLibs=true + ggml_backend_load_all_from_path(nativeLibraryDir) before llama_backend_init; verified on-device init OK (RSS 729 MB, Qwen0.5B Q4_K_M, contended)"
        tags: [llama.cpp, ggml, android, jni, apk]
      - id: A20
        problem: "Agent button crash: SQLiteException no such module: fts5"
        cause: "OP7 OxygenOS Android 10 SQLite lacks the FTS5 extension; MemoryDatabase.onCreate DDL failed and startSession ran outside try/catch -> uncaught coroutine crash"
        solution: "detect FTS5 availability (try/catch DDL), fall back to bounded LIKE term-hit retrieval; wrap startSession/endSession so memory failure degrades gracefully"
        tags: [sqlite, fts5, memory, crash, oneplus]
      - id: A21
        problem: "Agent unusable: persisted remote provider not re-registered after restart; local model required manual pre-load"
        cause: "providers registered only on picker selection; runAgent early-returned for unloaded local; messages not actionable"
        solution: "re-register persisted remote at startup; auto-load local GGUF on Agent/Generate; add in-app GGUF downloader (space check, magic verify, tmp+rename) + context selector; industrial UI redesign with real engine-state header"
        tags: [agent, router, models, download, ui, compose]
